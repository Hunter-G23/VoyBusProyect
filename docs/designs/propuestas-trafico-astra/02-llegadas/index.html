*{box-sizing:border-box}body{margin:0;font:16px Barlow,"Segoe UI",sans-serif;background:#eff0eb;color:#152f3b}h1,h2,h3,p{margin:0}button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--accent,#123fc4);outline-offset:-3px}button:active{opacity:.75}svg{display:block}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;flex:none}[hidden]{display:none!important}
main{max-width:1040px;margin:auto;padding:35px 34px 25px}.board{border-bottom:1px solid #bdc9c7;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:22px;gap:20px}.board h1{font-size:clamp(28px,4.2vw,50px);font-weight:600;letter-spacing:-.055em;line-height:1.02}.board h1 span{font:600 .51em Condensed,sans-serif;color:#123fc4;letter-spacing:0;vertical-align:middle;margin-right:5px}.board p{margin-top:8px;font-size:16px;color:#465d65}.board small{font-size:13px;color:#465d65;white-space:nowrap}.screens{display:grid;grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:50px;margin-top:27px}
.phone{--paper:#fffefa;--ink:#122b38;--muted:#4e6167;--line:#d5ded9;--sub:#f0f4ef;--accent:#123fc4;--active:#e8edf9;--sea:#b2d9d9;--sea-line:#90bebf;--land:#e6e9df;--blocks:#d9ded3;--streets:#f8faf4;--major:#c3ccb8;--park:#c1d4b7;--hill:#d0d8c5;--ridge:#b9c6ae;--shore:#8facaa;--map-text:#49646a;--map-small:#415f66;--stroke:#fffefa;color:var(--ink);background:var(--paper);border:1px solid #aebdb9;border-radius:24px;overflow:hidden;isolation:isolate;height:780px;position:relative;display:flex;flex-direction:column;min-width:0}
.dark{color-scheme:dark;--paper:#121c23;--ink:#f2f5ef;--muted:#b0bdc3;--line:#35444e;--sub:#202c35;--accent:#d1fa75;--active:#2d3933;--sea:#172f3a;--sea-line:#284653;--land:#394750;--blocks:#303b44;--streets:#44515a;--major:#59646b;--park:#3b5147;--hill:#364340;--ridge:#48574e;--shore:#67828a;--map-text:#c9d8d7;--map-small:#b3c5ca;--stroke:#eff4ed;border-color:#434f58}
.status{height:30px;flex:none;padding:7px 21px 0;display:flex;align-items:center;justify-content:space-between;font:bold 12px Arial,sans-serif}.status svg{width:52px;height:13px}.top{height:39px;flex:none;padding:1px 16px 0;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:600;letter-spacing:-1.7px;display:flex;gap:5px;align-items:center;line-height:1}.brand svg{height:22px;width:24px;color:var(--accent)}.city{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px;font-weight:600}.city .icon{width:14px;height:14px}.primary{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.search-open{background:var(--sub);width:calc(100% - 28px);margin:4px 14px 9px;border:1px solid var(--line);border-radius:9px;min-height:48px;flex:none;display:flex;align-items:center;gap:9px;text-align:left;padding:0 12px;color:var(--muted)}.search-open b{font-size:16px;color:var(--ink);font-weight:600}.search-open .end{margin-left:auto}.search-open .end .icon{width:15px}
.atlas{position:relative;min-height:0;flex:1;background:var(--sea);overflow:hidden;border-top:1px solid var(--line)}.base{width:100%;height:100%}.fleet-summary{position:absolute;left:11px;top:10px;padding:5px 8px;border-radius:5px;background:var(--paper);color:var(--ink);display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600;box-shadow:0 1px 3px #18353f1c;pointer-events:none}.fleet-summary .icon{width:14px;height:14px}.stop-label{position:absolute;pointer-events:none;white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.1px;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 5px;transform:translate(calc(-100% - 9px),-50%);z-index:2}

 const stop=stops[v.stop], offset=v.line?53:0;
 // Space below the drawing keeps both termini visible above the route selector.
 return '<div class="atlas"><div class="plot" style="position:absolute;inset:0 0 '+offset+'px"><svg class="base" viewBox="0 0 360 330" preserveAspectRatio="none" aria-label="Esquema costero de Antofagasta">'+tiles[i]+(v.line?'<path data-trace="'+v.line+'" d="'+route(v.line).d+'" stroke="'+route(v.line).color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>':'')+'<g font-family="Barlow,Arial,sans-serif" fill="var(--map-small)" font-size="12"><text x="13" y="145" font-style="italic">Océano</text><text x="13" y="160" font-style="italic">Pacífico</text><text x="268" y="131" font-weight="600" paint-order="stroke" stroke="var(--land)" stroke-width="2.5">Antofagasta</text></g></svg>'+dataset.buses.map(busMarker).join('')+stops.map((s,n)=>stopMarker(s,n,v)).join('')+'<span class="stop-label" style="'+mapPoint(stop.at)+'">'+stop.name+'</span></div><div class="fleet-summary">'+icon('bus')+'52 micros · 13 líneas</div>'+lineCard(v)+'</div>';
}
function panel(v){
 const s=stops[v.stop];
 return '<section class="panel"><div class="station-top"><div><span class="station-id">'+icon('stop')+'Paradero</span><h2 class="station-name">'+s.name+'</h2></div><button data-open class="change">Cambiar</button></div><div class="served"><span class="label">Pasan por aquí</span>'+s.arr.map(([id])=>'<strong>'+id+'</strong>').join('')+'</div><div class="arrival-top"><h3>Próximos buses</h3>'+demo+'</div>'+s.arr.map(([id,t])=>'<button class="arrival" data-line="'+id+'" data-on="'+(v.line===id)+'" aria-pressed="'+(v.line===id)+'" aria-label="Ver recorrido '+id+', '+t+' minutos aproximadamente">'+plate(id)+'<span class="to">'+short(route(id).to)+'</span><span class="eta">'+t+'<small>min aprox.</small></span>'+icon(v.line===id?'check':'arrow')+'</button>').join('')+'</section>';
}
const clean=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function options(q){return stops.map((s,n)=>clean(s.name).includes(clean(q))?'<button class="item" data-stop="'+n+'">'+icon('stop')+'<span>'+s.name+'</span>'+icon('arrow')+'</button>':'').join('')||'<p>Sin paraderos con ese nombre.</p>'}
function dialog(){return '<section class="drawer" role="dialog" aria-label="Elegir paradero"><div class="drawer-head"><h2>Elegir paradero</h2><button data-close aria-label="Cerrar búsqueda">'+icon('close')+'</button></div><label>'+icon('find')+'<input aria-label="Nombre del paradero" placeholder="Buscar por nombre" type="search"></label><div class="options">'+options('')+'</div></section>'}
function subpage(v){
 let inner;
 if(v.tab==='Líneas')inner='<div class="catalog">'+Object.entries(dataset.lines).map(([id,l])=>'<button class="item" data-line="'+id+'">'+plate(id)+'<span>'+short(l.from)+' → '+short(l.to)+'</span>'+icon('arrow')+'</button>').join('')+'</div>';
 else if(v.tab==='Favoritos')inner='<p>Guarda los paraderos que consultas con frecuencia.</p><button class="fav-btn" data-save>'+(v.saved.has(v.stop)?'Quitar':'Guardar')+' '+stops[v.stop].name+'</button>'+[...v.saved].map(n=>'<button class="item" data-stop="'+n+'">'+icon('stop')+'<span>'+stops[n].name+'</span>'+icon('arrow')+'</button>').join('');
 else inner='<p>Selecciona el paradero desde donde tomarás la micro.</p><button data-open class="cta">Elegir paradero</button>';
 return '<section class="subpage"><h2>'+v.tab+'</h2>'+inner+'</section>';
}
function render(i,focus){
 const p=phones[i],v=views[i];
 const map='<button class="search-open" data-open>'+icon('find')+'<b>Buscar paradero</b><span class="end">'+icon('down')+'</span></button>';
 p.innerHTML=chromeTop+'<div class="primary">'+(v.tab==='Mapa'?map+atlas(v,i)+panel(v):subpage(v))+(v.drawer?dialog():'')+'</div><nav class="nav" aria-label="Navegación">'+[['Mapa','map'],['Líneas','lines'],['Favoritos','fav'],['Mi viaje','trip']].map(([tab,ic])=>'<button data-tab="'+tab+'" '+(v.tab===tab?'aria-current="page"':'')+'>'+icon(ic)+tab+'</button>').join('')+'</nav>';
 if(v.drawer){for(const el of p.querySelector('.primary').children)if(!el.matches('.drawer'))el.inert=true;}
 if(focus)p.querySelector(focus)?.focus({preventScroll:true});
}
function nearest(e,plot){
 const b=plot.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
 const all=[...stops.map((s,n)=>({key:'stop',id:n,at:s.at})),...dataset.buses.map(b=>({key:'bus',id:b.n,at:b.at}))];
 return all.map(item=>{const dx=x-item.at[0]*b.width/360,dy=y-item.at[1]*b.height/330;
   return {...item,hit:Math.abs(dx)<=24&&Math.abs(dy)<=24,dist:Math.min(Math.hypot(dx,dy),item.key==='bus'?Math.hypot(dx-8,dy+9):Infinity)};
 }).filter(a=>a.hit).sort((a,b)=>a.dist-b.dist)[0];
}
phones.forEach((p,i)=>{
 const v=views[i];render(i);
 p.addEventListener('input',e=>{if(e.target.matches('.drawer input'))p.querySelector('.options').innerHTML=options(e.target.value)});
 p.addEventListener('keydown',e=>{if(e.key==='Escape'&&v.drawer){v.drawer=false;render(i,'[data-open]')}});
 p.addEventListener('click',e=>{
   const el=e.target.closest('button'),plot=e.target.closest('.plot');let a=el?.dataset;
   if(!a&&plot){const hit=nearest(e,plot);if(hit)a={[hit.key]:String(hit.id)}}
   if(!a)return;
   let focus=null;
   if('open'in a){v.drawer=true;focus='.drawer input'}
   else if('close'in a){v.drawer=false;focus='[data-open]'}
   else if('tab'in a){v.tab=a.tab;v.drawer=false;focus='[aria-current=page]'}
   else if('stop'in a){v.stop=Number(a.stop);v.line=null;v.bus=null;v.tab='Mapa';v.drawer=false;focus='[data-open]'}
   else if('bus'in a){const b=dataset.buses.find(b=>b.n===Number(a.bus));v.line=b.line;v.bus=b.n;focus='[data-clear]'}
   else if('line'in a){v.tab='Mapa';v.line=a.line;v.bus=null;focus='[data-clear]'}
   else if('clear'in a){v.line=null;v.bus=null;focus='[data-open]'}
   else if('save'in a){if(v.saved.has(v.stop))v.saved.delete(v.stop);else v.saved.add(v.stop);focus='[data-save]'}
   render(i,e.detail===0||v.drawer?focus:null);
 });
});
</script></html>
