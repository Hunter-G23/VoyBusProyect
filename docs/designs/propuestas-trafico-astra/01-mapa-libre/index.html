const status='<div class="status" aria-hidden="true">9:41<svg viewBox="0 0 64 15" fill="currentColor"><path d="M1 10h3v4H1zm5-3h3v7H6zm5-3h3v10h-3zm5-3h3v13h-3zM23 5q7-7 14 0l-1.8 1.9Q30 2 24.8 7Zm3.2 3q4-4.4 7.6 0L32 10q-2-2-4 0zm2.3 3 1.6 2 1.7-2q-1.7-1.8-3.3 0Z"/><rect x="41" y="2" width="19" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="43" y="4" width="15" height="7" rx="1.5"/><path d="M61 5h1.4v5H61z"/></svg></div>';
const stops=[
 {id:'PB-01',name:'Parque Brasil',p:[177,328],lines:['102','E01','103'],eta:[3,6,9]},
 {id:'CM-02',name:'Mercado Central',p:[230,283],lines:['103','108','114'],eta:[2,5,11]},
 {id:'CH-03',name:'La Chimba',p:[177,139],lines:['E01','104','112'],eta:[4,8,12]},
 {id:'UA-04',name:'Universidad de Antofagasta',p:[115,410],lines:['107','119','129'],eta:[3,7,10]},
 {id:'CN-05',name:'Costanera Norte',p:[173,218],lines:['111','121','110'],eta:[2,8,13]}
];
const fleet=lines.flatMap((l,j)=>l.buses.map((p,k)=>({l,p,id:'B'+String(1+j*4+k).padStart(2,'0'),mini:k===(j%4)})));
const views=[...document.querySelectorAll('.device')].map((el,i)=>({el,i,line:i?'':'102',stop:i?stops[0]:null,bus:null,tab:'map',tick:0,timer:null}));
const favs=new Set();
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const chart='<path d="m9 1.8-6 18 6-5 6 5Z" fill="var(--paper)" stroke="var(--textmap)" stroke-width=".9"/><path d="M9 1.8v13l6 5z" fill="var(--textmap)"/>';
const side='M134-12 137 17 145 39 133 63 140 85 128 105 145 128 142 138 152 153 146 167 157 193 151 208 156 224 148 240 160 250 155 267 144 285 151 297 134 312 126 327 117 334 111 354 100 365 95 379 81 390 81 405 68 422 67 437 48 451 48 461 36 476 27 506';
const urban='M261-10 268 40 257 71 246 99 260 125 258 151 288 179 295 197 316 224 318 242 293 270 301 289 270 313 245 327 236 347 205 366 209 386 182 404 148 419 133 438 125 453 89 470 86 485 76 507';
function mapArt(idx){
 const land=side+'H370V-12Z';const grid=urban+'H-10V-12Z';
  const hillcurve='M256-14q20 30 3 73t-5 71 34 54 26 59-25 45-47 59-27 28-36 39-49 40-45 54';
 const seacurve='M133-13q14 29 6 57t-2 39-3 28 11 33 4 37 4 33-3 27 5 27-11 21-9 24-18 25-14 22-18 30-12 30-16 32-20 29-14 30';
 const hatch=Array.from({length:18},(_,k)=>'<path transform="translate('+k*5+',0)" d="'+hillcurve+'" fill="none" stroke="var(--hills)" stroke-width=".75"/>').join('');
 const bath=Array.from({length:8},(_,k)=>'<path transform="translate('+(-11-k*14)+','+k*1.6+')" d="'+seacurve+'" fill="none" stroke="var(--bath)" stroke-width=".65"/>').join('');
 const major=['M201-10q-25 56-8 102t10 70 25 70-12 72-38 58-49 63-46 68','M241-14q-23 46-6 93t-2 77 32 66 5 72-52 70-31 50-75 87','m140 163 113 39 56 31m-167 15 94 31 69 21m-172 48 102 37m-169 35 112 41'];
 return '<svg viewBox="0 0 360 500" class="map-art" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="land'+idx+'"><path d="'+land+'"/></clipPath><clipPath id="urban'+idx+'"><path d="'+grid+'"/></clipPath><pattern id="blocks'+idx+'" width="27" height="32" patternTransform="rotate(18)" patternUnits="userSpaceOnUse"><rect width="27" height="32" fill="var(--road)"/><path d="M1 1h12v10H1zm14 0h11v10H15zM1 13h8v18H1zm10 0h15v8H11zm0 10h15v8H11z" fill="var(--block)"/><path d="M3 3h5v5H3zm14 12h5v5h-5z" fill="var(--block2)"/></pattern></defs><rect width="360" height="500" fill="var(--sea)"/>'+bath+'<path d="'+land+'" fill="var(--land)"/><g clip-path="url(#land'+idx+')">'+hatch+'<g clip-path="url(#urban'+idx+')"><path d="'+land+'" fill="url(#blocks'+idx+')"/><g fill="none" stroke="var(--road)" stroke-width="4">'+major.map(d=>'<path d="'+d+'"/>').join('')+'</g><path d="m169 314 17 6-8 16-18-5zm29-147 20 8-7 12-19-6zm-67 201 12 6-5 11-12-6z" fill="var(--park)"/></g></g><g fill="var(--block2)" stroke="var(--hills)" stroke-width="1"><path d="m144 282-28-8-1 4 26 9zm-6 16-31-10-2 5 30 11zm-5 8-26-9-1 3 25 10z"/></g><g class="routes"></g><g class="map-label"><text x="219" y="119">La Chimba</text><text x="277" y="235" transform="rotate(-72 277 235)">Av. Argentina</text><text x="142" y="302" text-anchor="end" style="font-size:19px;font-weight:650">Antofagasta</text><text x="151" y="442">El Huáscar</text></g><text x="55" y="248" transform="rotate(-72 55 248)" font-family="Georgia,serif" font-size="16" font-style="italic" fill="var(--oceantext)">Océano Pacífico</text></svg>'
}
const styleRoute=l=>'--route:'+l.color+';--routeText:'+l.text;
function smallBus(l){return '<svg class="minibus" viewBox="0 0 15 16" aria-hidden="true"><rect x="1" y="1" width="13" height="13" rx="3" stroke="#fffefa" fill="'+l.color+'"/><path d="M4 4h7v4H4zm0 6h2v1.5H4zm5 0h2v1.5H9zM3 13h2v2H3zm7 0h2v2h-2z" fill="#fffefa"/></svg>'+(l.electric?'<svg class="spark" viewBox="0 0 9 12" aria-hidden="true"><path fill="currentColor" stroke="#34421a" stroke-width=".6" d="M5.7.3.7 7h3L3 11.7l5.1-7.3H4.8Z"/></svg>':'')}
function layout(p){
 const el=p.el;
 const options=lines.map(l=>'<option value="'+l.id+'">'+l.id+' · '+l.name+'</option>').join('');
 const nav=[['map','Mapa'],['list','Líneas'],['fav','Favoritos'],['trip','Mi viaje']].map(([tab,label])=>'<button data-tab="'+tab+'" '+(tab==='map'?'aria-current="page"':'')+'>'+ic(tab)+label+'</button>').join('');
 el.innerHTML=status+'<div class="brandbar">'+brand+'<button class="fleetcount" aria-pressed="false" aria-label="Reproducir simulación de los 52 buses" title="Reproducir simulación de los 52 buses">'+ic('play')+'52 buses · 13 líneas</button><button class="theme" aria-label="Cambiar tema">'+ic('theme')+'</button></div><div class="map-wrap" role="region" aria-label="Mapa de la flota de Antofagasta">'+mapArt(p.i)+'<div class="plot" aria-label="Buses y paraderos simulados"></div><div class="compass" aria-label="Norte">N<svg viewBox="0 0 18 23" aria-hidden="true">'+chart+'</svg></div><div class="toolbar"><label class="search">'+ic('search')+'<input type="search" aria-label="Buscar paradero o línea" placeholder="Buscar paradero o línea" autocomplete="off"></label><div class="results" hidden></div><div class="filter" aria-label="Recorrido visible">'+['','102','103','E01'].map(id=>'<button data-line="'+id+'"><span>'+(id||'Todas')+'</span></button>').join('')+'<label class="more-holder"><span class="more">Otras '+ic('down')+'</span><select aria-label="Elegir otra línea"><option value="">Todas las líneas</option>'+options+'</select></label></div></div></div><div class="sheet" aria-live="polite"></div><div class="drawer" hidden></div><nav class="nav" aria-label="Navegación">'+nav+'</nav>';
 el.querySelector('select').onchange=e=>changeLine(p,e.target.value);
 const input=el.querySelector('input');
 input.oninput=()=>search(p,input.value);
 input.onkeydown=e=>{if(e.key==='Escape'){input.value='';search(p,'')}};
 el.querySelector('.plot').addEventListener('click',e=>{
  const wrap=e.currentTarget,rect=wrap.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  let point;
  if(e.detail===0||e.target.closest('.stop-call'))point=e.target.closest('.point');
  else {
   const nearest=[...wrap.querySelectorAll('.point')].map(b=>({b,d:Math.hypot(x-b.offsetLeft,y-b.offsetTop)})).sort((a,b)=>a.d-b.d)[0];
   if(nearest && Math.abs(x-nearest.b.offsetLeft)<=24 && Math.abs(y-nearest.b.offsetTop)<=24)point=nearest.b
  }
  if(!point)return;
  if(point.dataset.stop)chooseStop(p,point.dataset.stop);
  if(point.dataset.bus){p.bus=fleet.find(b=>b.id===point.dataset.bus);p.line=p.bus.l.id;p.stop=null;paint(p)}
  if(e.detail===0)el.querySelector(point.dataset.bus?'[data-bus="'+point.dataset.bus+'"]':'[data-stop="'+point.dataset.stop+'"]').focus();
 });
 el.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.matches('.fleetcount')){
   const running=p.timer===null;
   if(running){
    p.tick++;moveFleet(p);
    p.timer=setInterval(()=>{if(!document.hidden){p.tick++;moveFleet(p)}},1100)
   }else{clearInterval(p.timer);p.timer=null}
   b.innerHTML=ic(running?'pause':'play')+'52 buses · 13 líneas';
   b.setAttribute('aria-pressed',String(running));
   const label=(running?'Pausar':'Reproducir')+' simulación de los 52 buses';
   b.setAttribute('aria-label',label);b.title=label;return
  }
  if(b.matches('.theme')){el.classList.toggle('dark');el.setAttribute('aria-label','Mapa en tema '+(el.classList.contains('dark')?'Pulso':'Costa'));return}
  if(b.hasAttribute('data-line')){changeLine(p,b.dataset.line);return}
  if(b.dataset.resultStop){chooseStop(p,b.dataset.resultStop);return}
  if(b.dataset.resultLine){changeLine(p,b.dataset.resultLine);return}
  if(b.dataset.favorite){const id=b.dataset.favorite;favs.has(id)?favs.delete(id):favs.add(id);views.filter(v=>['fav','list'].includes(v.tab)).forEach(drawer);return}
  if(b.dataset.tab){p.tab=b.dataset.tab;drawer(p)}
 });
 paint(p)
}
function search(p,text){
 const box=p.el.querySelector('.results'),q=norm(text);box.hidden=!q;if(!q)return;
 const choices=[...stops.filter(s=>norm(s.name+' '+s.id).includes(q)).map(s=>'<button data-result-stop="'+s.id+'">'+s.name+' · '+s.id+'</button>'),...lines.filter(l=>norm(l.id+' '+l.name).includes(q)).map(l=>'<button data-result-line="'+l.id+'"><b>'+l.id+'</b> · '+l.name+'</button>')];
 box.innerHTML=choices.join('')||'<p>Sin coincidencias.</p>'
}
function changeLine(p,id){p.line=id;p.stop=null;p.bus=null;p.tab='map';drawer(p);paint(p)}
function chooseStop(p,id){p.stop=stops.find(s=>s.id===id);p.bus=null;paint(p)}
function drawer(p){
 const box=p.el.querySelector('.drawer');box.hidden=p.tab==='map';
 p.el.querySelectorAll('[data-tab]').forEach(b=>b.dataset.tab===p.tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 if(box.hidden)return;
 const titles={list:'Líneas',fav:'Favoritos',trip:'Mi viaje'};
 const items=p.tab==='list'?lines:lines.filter(l=>favs.has(l.id));
 box.innerHTML='<h2>'+titles[p.tab]+'</h2>'+(p.tab==='trip'?'<p>Aún no has iniciado un viaje.</p>':items.length?items.map(l=>'<div class="list-line" style="'+styleRoute(l)+'"><button data-result-line="'+l.id+'"><strong>'+l.id+'</strong> '+l.name+'</button><button class="fav" data-favorite="'+l.id+'" aria-label="Favorito línea '+l.id+'" aria-pressed="'+favs.has(l.id)+'">'+(favs.has(l.id)?'★':'☆')+'</button></div>').join(''):'<p>Guarda una línea desde el catálogo para verla aquí.</p>')
}
for(const l of lines){
 l.dist=[0];
 for(let i=1;i<l.shape.length;i++)l.dist.push(l.dist[i-1]+Math.hypot(l.shape[i][0]-l.shape[i-1][0],l.shape[i][1]-l.shape[i-1][1]));
}
for(const b of fleet)b.start=b.l.dist[b.l.shape.findIndex(v=>v[0]===b.p[0]&&v[1]===b.p[1])];
function position(p,b){
 if(p.tick===0)return b.p;
 const {dist,shape}=b.l,length=dist.at(-1);
 const k=(b.start+p.tick*(1+Number(b.id.slice(1))%3*.25))%(length*2);
 const at=k<=length?k:length*2-k;
 const i=dist.findIndex(v=>v>=at);
 if(i<=0)return shape[0];
 const t=(at-dist[i-1])/(dist[i]-dist[i-1]||1);
 return [shape[i-1][0]+t*(shape[i][0]-shape[i-1][0]),shape[i-1][1]+t*(shape[i][1]-shape[i-1][1])]
}
function moveFleet(p){
 const points=p.el.querySelectorAll('.bus-point');
 fleet.forEach((b,i)=>{const [x,y]=position(p,b);points[i].style.left=x/360*100+'%';points[i].style.top=y/500*100+'%'})
}
function paint(p){
 const el=p.el,l=findLine(p.line),lineLayer=el.querySelector('.routes');
 el.querySelector('.results').hidden=true;el.querySelector('input').value='';
 for(const b of el.querySelectorAll('.filter [data-line]'))b.setAttribute('aria-pressed',String(b.dataset.line===p.line));
 el.querySelector('select').value=p.line;
 const more=el.querySelector('.more'),other=!!l&&!['102','103','E01'].includes(p.line);
 more.classList.toggle('active',other);more.innerHTML=(other?p.line:'Otras')+' '+ic('down');
 if(l){
  const d='M'+l.shape.map(pos=>pos.join(',')).join('L');
  lineLayer.innerHTML='<path class="stroke-route halo" d="'+d+'" stroke="var(--paper)" stroke-width="5.8"/><path class="stroke-route trace" data-trace="'+l.id+'" d="'+d+'" stroke="'+l.color+'" stroke-width="3.05"/>'+[l.shape[0],l.shape.at(-1)].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--paper)" stroke="'+l.color+'" stroke-width="2"/>').join('')
 }else lineLayer.replaceChildren();
 const pos=pt=>'left:'+pt[0]/360*100+'%;top:'+pt[1]/500*100+'%;';
 el.querySelector('.plot').innerHTML=fleet.map(b=>'<button class="point bus-point '+(p.bus===b?'chosen':'')+'" data-bus="'+b.id+'" style="'+pos(position(p,b))+styleRoute(b.l)+'" aria-label="Bus '+b.id+', línea '+b.l.id+'"><span class="dot"></span>'+(b.mini||p.bus===b||p.line===b.l.id?smallBus(b.l):'')+'</button>').join('')+stops.map(s=>'<button class="point stop '+(p.stop===s?'chosen':'')+'" style="'+pos(s.p)+'" data-stop="'+s.id+'" aria-label="Paradero '+s.name+'"><svg class="sign" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 10v7m-2 0h4" stroke="currentColor" stroke-width="1.7"/><rect x="1.6" y="1.3" width="10.8" height="10" rx="1.5" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/><path d="M4 4.2h6m-6 3h4.5" stroke="currentColor" stroke-width="1.2"/></svg>'+(p.stop===s?'<span class="stop-call">'+s.name+'</span>':'')+'</button>').join('');
 const sheet=el.querySelector('.sheet');sheet.className='sheet'+(p.stop?' stop-sheet':'');
 const demo='<p class="demo">Demo · tiempos simulados</p>';
 if(p.stop){
  const s=p.stop;
  sheet.innerHTML='<div class="title-box">'+ic('stop')+'<h2 class="heading">'+s.name+'</h2></div><div class="via"><span class="meta">'+s.id+' · Líneas</span>'+s.lines.map(id=>'<span class="tag">'+id+'</span>').join('')+'</div><div class="arrivals">'+s.lines.map((id,k)=>{const r=findLine(id),b=fleet.filter(bus=>bus.l===r)[k];return '<div class="arrival" style="'+styleRoute(r)+'"><strong>'+id+'</strong><span>'+b.id+' · '+(r.electric?'Eléctrico':'Bus')+' a '+r.name.split(' → ')[1]+'</span><span class="eta">≈ '+s.eta[k]+' min</span></div>'}).join('')+'</div>'+demo
 }else if(l){
  sheet.innerHTML='<div class="top"><span class="plate" style="'+styleRoute(l)+'">'+l.id+'</span><span class="meta">'+(p.bus?'Bus '+p.bus.id+' · '+(l.electric?'Eléctrico':'Convencional'):'Recorrido de ida · 4 buses')+'</span></div><button class="close" data-line="" aria-label="Limpiar recorrido">'+ic('close')+'</button><h2 class="title-line">'+l.name+'</h2>'+demo
 }else sheet.innerHTML='<div class="top"><h2 class="heading">Flota completa</h2></div><p class="meta" style="margin-top:5px">Toca un bus o un paradero para ver su ficha.</p>'+demo;
 sheet.classList.add('updated')
}
views.forEach(layout);
</script></body></html>
