<style>

  @media(max-width:749px) { .board { padding-top:12px; } .phones { padding-top:12px; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } button:active { transform:none; } .marker:active { transform:translate(-50%,-50%); } }

<script>

const icon = name => '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">'+symbols[name]+'</svg>';
const indicators='<svg aria-hidden="true" viewBox="0 0 60 14" fill="currentColor"><path d="M0 10h3v3H0zm5-3h3v6H5zm5-3h3v9h-3zm5-3h3v12h-3z"/><path d="M23 5q7-7 14 0l-1.5 1.6q-5.5-5.1-11 0zm3 3q4-4 8 0l-1.6 1.6q-2.4-2-4.8 0zm3 3q1-1 2 0l-1 1.4z"/><rect x="41" y="3" width="16" height="8" rx="1.6" fill="none" stroke="currentColor"/><rect x="43" y="5" width="12" height="4" rx=".8"/><path d="M58 5h1v4h-1z"/></svg>';

function service(line) {

function fold(value) { return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

const shore='M160 -5 158 18 145 39 146 58 137 76 126 83 122 110 130 124 123 142 110 154 108 179 116 191 110 212 100 227 96 250 88 261 90 278 79 290 78 305 65 325 66 338 53 361 57 382 42 401 43 416 30 436 28 466';
const cityShape=shore+' H375 V-5 Z';
function streets() {
  let blocks='';
  function point(column, row) {
    const y=row*18;

  }

    for (let col=1;col<28;col++) {
      const points=[point(col,row),point(col+1,row),point(col+1,row+1),point(col,row+1)];
      const index=Math.abs(row*7+col*3);
      const mid=points.reduce(([x,y],[px,py])=>[x+px/4,y+py/4],[0,0]);

      blocks+='<polygon points="'+corners+'" fill="'+(index%31===0?'#bfc8a2':colors[index%6])+'"/>';
    }
  }

    return '<path d="'+routes[line.id]+'" fill="none" stroke="#faf6e9" stroke-width="'+(chosen?5.8:4.8)+'"/><path d="'+routes[line.id]+'" fill="none" stroke="'+line.color+'" stroke-linejoin="round" stroke-width="'+(chosen?2.8:1.8)+'" '+(!active?'stroke-dasharray="5 4"':'')+' />'+(stops[line.id]||[]).map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="#fffaf0" stroke="'+line.color+'" stroke-width="1.7"/>').join('');
  }).join('');
  return '<svg class="atlas" viewBox="0 0 360 460" preserveAspectRatio="none" role="img" aria-label="Esquema costero de Antofagasta con recorridos y paraderos simulados"><defs><clipPath id="city'+uid+'"><path d="'+cityShape+'"/></clipPath><pattern id="sea'+uid+'" width="28" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="6" r=".9" fill="#80a8a3"/><path d="M14 15h4" stroke="#a1c1bb" stroke-width=".8"/></pattern></defs><rect width="360" height="460" fill="#bad2cb"/><rect width="360" height="460" fill="url(#sea'+uid+')"/><g fill="none" stroke="#d5e3d9" stroke-width="1.1"><path d="'+shore+'" transform="translate(-6,-1)"/><path d="'+shore+'" transform="translate(-13,-1)"/></g><path d="'+cityShape+'" fill="#f7f2e6"/><g clip-path="url(#city'+uid+')">'+blocks+'<g fill="none" stroke="#f9f6ec" stroke-width="5"><path d="M95 107 280 151 371 169M54 301 169 325 292 349M117 208 217 231 300 245M148 34l210 49"/><path d="'+shore+'" stroke-width="9"/></g><path fill="#e4dcc4" d="M307 -5q-26 46-8 74t-10 57q-13 31 0 55t-11 61q-18 42-9 75t-24 72q-20 37-14 75h148V-5Z"/><g fill="none" stroke="#c7bda3" stroke-width="0.9">'+contours+'</g>'+tracks+'</g><path d="'+shore+'" stroke="#8faba1" fill="none"/><g><text class="ocean" x="24" y="201">Océano</text><text class="ocean" x="24" y="218">Pacífico</text><text class="district" x="212" y="41">LA CHIMBA</text><text class="town" x="175" y="241">Antofagasta</text><text x="115" y="158" transform="rotate(-69 115 158)">Costanera</text><text x="209" y="357" transform="rotate(-68 209 357)">Av. Argentina</text><text class="district" x="63" y="448">EL HUÁSCAR</text></g></svg>';
}
const north='<div class="north" aria-label="Norte"><span>N</span><svg viewBox="0 0 12 15" aria-hidden="true"><path d="m6 0 6 14-6-3-6 3Z" fill="#222521"/><path d="M6 2v8l4.5 2Z" fill="#fffcf5"/></svg></div>';
function updateMap(phone, focusBus) {
  const selected=lines.find(line=>line.id===phone.dataset.selected);
  phone.querySelector('.map').innerHTML=cartography(phone.dataset.uid, selected.id)+north+markers(selected.id);
  phone.querySelector('.ticket').innerHTML=ticket(selected);
  if (focusBus) phone.querySelector('[data-bus="'+selected.id+'"]').focus({preventScroll:true});
}
function render(phone, screen) {
  phone.dataset.screen=screen;
  if(screen==='trip') {
    const picker='trip-'+phone.dataset.uid;
    const options=lines.map(line=>'<option value="'+line.id+'">'+line.id+' · '+line.origin+' → '+line.dest+'</option>').join('');
    phone.innerHTML=header('Mi viaje',true)+'<div class="trip"><label for="'+picker+'">Elige un recorrido</label><select id="'+picker+'">'+options+'</select><button data-trip-map>Ver recorrido en el mapa</button></div>'+nav(screen);
    return;
  }
  const isMap=screen==='map', title=isMap?'Mapa':screen==='saved'?'Favoritos':'Líneas';
  const filter='<label class="filter"><select aria-label="Filtrar por estado"><option value="">Estado</option><option value="Activa">Activas</option><option value="Pausa temporal">En pausa</option><option value="Inactiva">Inactivas</option></select>'+icon('down')+'</label>';
  phone.innerHTML=header(title,isMap)+(isMap?'<div class="map"></div><section class="ticket" aria-live="polite" aria-label="Detalle del recorrido"></section>':'<div class="listbar"><span class="kicker count" aria-live="polite"></span>'+filter+'</div><div class="list" role="region" aria-label="Resultados"></div>'+demo)+nav(screen);
  if(isMap) updateMap(phone,false);
  else drawList(phone);
}
document.querySelectorAll('.phone').forEach((phone,i)=>{
  phone.dataset.uid=String(i);
  phone.dataset.selected='E01';
  render(phone,phone.dataset.screen);
  phone.addEventListener('input',e=>{ if(e.target.matches('input'))drawList(phone); });
  phone.addEventListener('change',e=>{ if(e.target.matches('.filter select'))drawList(phone); });
  phone.addEventListener('click',e=>{
    const control=e.target.closest('button');
    if(!control)return;
    if(control.dataset.star) {
      const id=control.dataset.star;
      if(stars.has(id))stars.delete(id); else stars.add(id);
      document.querySelectorAll('[data-star="'+id+'"]').forEach(el=>el.setAttribute('aria-pressed',stars.has(id)));
      document.querySelectorAll('[data-screen="saved"]').forEach(saved=>{
        drawList(saved);
        if(saved===phone)saved.querySelector('.star, input').focus({preventScroll:true});
      });
    } else if(control.dataset.bus) {
      phone.dataset.selected=control.dataset.bus;
      updateMap(phone,e.detail===0);
    } else {
      if(control.hasAttribute('data-trip-map')) phone.dataset.selected=phone.querySelector('.trip select').value;
      if(control.dataset.line)phone.dataset.selected=control.dataset.line;
      render(phone, control.dataset.tab||'map');
      if(e.detail===0)phone.querySelector('.tab[aria-current="page"]').focus({preventScroll:true});
    }
  });
});
</script>
</html>
