:root { color-scheme:dark; --paper:#171d23; --screen:#101920; --panel:#19232c; --rule:#34414b; --muted:#b0bdc3; --white:#f2f5ef; --lime:#d1fa75; font-family:Barlow,Arial,sans-serif; font-size:16px; color:var(--white); background:var(--paper) }
* { box-sizing:border-box } body,h1,h2,h3,p { margin:0 } button,input { font:inherit; color:inherit } button { background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation } button:active { opacity:.77 } button:focus-visible,input:focus-visible { outline:2px solid var(--lime); outline-offset:-3px } svg { display:block } .ico { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
main { max-width:1040px; padding:34px 32px 24px; margin:auto } .board-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-bottom:23px; border-bottom:1px solid #41484c } h1 { font-size:clamp(42px,5vw,64px); letter-spacing:-.055em; font-weight:600; line-height:.95 } h1 span { color:#a9b4b8; font-family:Condensed,Arial,sans-serif; font-size:.48em; letter-spacing:0; vertical-align:middle; margin-right:6px } .descriptor { color:#c5ced0; margin-top:9px; font-size:16px } .board-note { display:flex; align-items:center; gap:8px; font-size:13px; color:#c5ced0; padding-bottom:2px } .board-note::before { content:""; width:12px; height:3px; background:var(--lime); transform:skew(-25deg) }
.boards { display:grid; grid-template-columns:repeat(2,minmax(0,360px)); justify-content:center; gap:clamp(28px,5vw,72px); margin:28px auto 0 } .screen { border:1px solid #49545b; border-radius:25px; width:100%; height:780px; position:relative; overflow:hidden; background:var(--screen); isolation:isolate; display:flex; flex-direction:column } .status { flex:0 0 37px; display:flex; justify-content:space-between; align-items:center; padding:4px 23px 0; font:bold 13px Arial,sans-serif; z-index:2; pointer-events:none } .status svg { width:53px; height:12px; fill:currentColor } .content { flex:1; min-height:0; display:flex; flex-direction:column } .brand { display:inline-flex; align-items:center; gap:7px; font-size:24px; letter-spacing:-1.6px; line-height:1; font-weight:600 } .brand svg { width:27px; height:26px; color:var(--lime) } .brandbar { display:flex; justify-content:space-between; align-items:center; height:49px; margin:0 19px; position:relative; z-index:1 } .place { display:flex; align-items:center; gap:5px; font-size:13px; color:#dae2e3; font-weight:600 } .place .ico { width:15px }
.nav { flex:0 0 73px; background:#111a21; border-top:1px solid var(--rule); position:relative; z-index:3; display:flex; justify-content:space-evenly; align-items:flex-start; padding:4px 8px 0 } .nav button { width:31%; height:49px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:12px; font-weight:600 } .nav button[aria-current="page"] { color:var(--lime) } .nav::after { content:""; position:absolute; bottom:6px; background:#ccd4d4; border-radius:4px; width:91px; height:4px }
.catalog { padding:0 17px; display:flex; flex-direction:column; min-height:0; flex:1 } .catalog-title { display:flex; justify-content:space-between; align-items:baseline; margin:15px 1px 13px } h2 { font-weight:600; font-size:43px; line-height:1.02; letter-spacing:-2.5px } .count { color:var(--muted); font-size:13px } .search { border:1px solid #45515b; background:#1d2933; border-radius:10px; height:48px; display:flex; align-items:center; gap:9px; padding:0 12px; color:#c6d1d4; flex:none } .search input { background:transparent; border:none; min-width:0; flex:1; height:46px; } .search input::placeholder { color:#bdc8cb }
.filters { display:flex; align-items:stretch; gap:17px; border-bottom:1px solid var(--rule); flex:none; padding:0 2px } .filters button { min-height:49px; min-width:48px; color:var(--muted); font-size:14px; font-weight:600; position:relative; white-space:nowrap } .filters button[aria-pressed="true"] { color:var(--lime) } .filters button[aria-pressed="true"]::after { content:""; position:absolute; height:3px; bottom:-1px; left:0; right:0; border-radius:2px; background:var(--lime) }
.rows { flex:1; overflow:auto; scrollbar-width:thin; scrollbar-color:#3a4a57 transparent } .row { display:flex; align-items:center; min-height:77px; border-bottom:1px solid #303d47 } .row-main { flex:1; min-width:0; display:flex; align-items:center; gap:11px; text-align:left; min-height:76px } .code { font-family:Condensed,'Arial Narrow',Arial,sans-serif; font-weight:600; font-size:31px; line-height:1; letter-spacing:-1px; border-left:4px solid var(--gtfs); padding-left:7px; width:55px; flex:none } .dest { display:block; font-size:16px; font-weight:600; line-height:1.2; letter-spacing:-.35px } .service { font-size:12px; display:inline-flex; align-items:center; gap:5px; font-weight:600; color:#c1d1b3; margin-top:5px } .service .ico { width:13px; height:13px } .service.pause { color:#f0c58a } .service.off { color:#afbbc3 } .star { width:48px; height:48px; flex:none; display:grid; place-items:center; color:#aebdc3 } .star[aria-pressed=true] { color:var(--lime) } .star[aria-pressed=true] .ico { fill:var(--lime); stroke:var(--lime) } .empty { margin:20px 0; color:var(--muted) }
.demo { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted) } .demo .ico { width:14px; height:14px } .catalog>.demo { padding:8px 2px 12px } .map-header { height:48px; display:flex; justify-content:space-between; align-items:center; margin:0 14px; z-index:1; pointer-events:none } .map-header .brand { background:#141e27; border:1px solid #455360; padding:7px 10px; border-radius:9px; font-size:20px; letter-spacing:-1px } .map-header .brand svg { width:22px; height:21px } .compass { display:flex; align-items:center; gap:5px; font-size:14px; font-weight:600; background:#141e27; padding:6px 8px; border-radius:7px; border:1px solid #455360 } .compass svg { width:12px; height:18px } .map-wrap { position:absolute; inset:0 0 auto; height:66%; background:#132833 } .map-art { width:100%; height:100% } .marker { position:absolute; width:48px; height:48px; display:grid; place-items:center; transform:translate(-50%,-50%); z-index:1 } .marker>.vehicle { width:20px; height:24px; filter:drop-shadow(0 1px 1px #09151c) } .marker-label { display:none; position:absolute; bottom:37px; left:50%; transform:translateX(-50%); font:600 15px Barlow,Arial,sans-serif; background:var(--lime); color:#182515; padding:2px 7px 3px; border-radius:4px; } .marker[aria-pressed=true] .marker-label { display:block } .map-spacer { flex:1; min-height:0 } .sheet { background:var(--panel); border-top:1px solid #51606b; border-radius:22px 22px 0 0; position:relative; padding:18px 20px 15px; z-index:2; flex:none } .sheet::before { content:''; position:absolute; top:7px; height:3px; border-radius:3px; width:30px; left:calc(50% - 15px); background:#697780 }
.sheet-meta { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; font-weight:600; } .sheet-line { display:flex; align-items:center; justify-content:space-between; margin:2px 0 4px } .sheet-code { display:inline-flex; gap:7px; align-items:center; font-family:Condensed,Arial,sans-serif; font-size:59px; line-height:1; letter-spacing:-1.7px } .electric { color:var(--lime); border-radius:5px; background:#344137; padding:3px } .electric .ico { width:17px; height:17px } .sheet-rule { border-top:1px solid #3d4b56; padding-top:11px; margin-top:7px; display:flex; gap:13px; align-items:center } .line-track { width:14px; height:47px; flex:none; color:var(--lime) } .stops { display:grid; gap:8px; font-size:16px; font-weight:600; line-height:1.2 } .stop { display:flex; align-items:baseline; gap:9px } .stop small { font-weight:400; font-size:12px; color:var(--muted) } .sheet .demo { margin-top:13px }

}

<main>
  <header class="board-head"><div><h1><span>03 /</span> Pulso</h1><p class="descriptor">Un mapa nocturno para seguir las micros de Antofagasta.</p></div><p class="board-note">Propuesta · datos de demostración</p></header>
  <div class="boards"><section class="screen" aria-label="Primera pantalla"></section><section class="screen" aria-label="Segunda pantalla"></section></div>
</main>
<script>
'use strict';
const lines=[
  {id:'102',from:'Amatista',to:'El Huáscar',color:'#005BAA',state:'Activa'},
  {id:'103',from:'El Coigue',to:'El Huáscar',color:'#005BAA',state:'Activa'},
  {id:'104',from:'Av. Huamachuco',to:'El Huáscar',color:'#007DBD',state:'Pausa temporal'},
  {id:'107',from:'Oficina Anita',to:'UA',color:'#A92023',state:'Inactiva'},
  {id:'E01',from:'La Chimba',to:'UA',color:'#598200',state:'Activa',electric:true}
];
const icons={
  pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',
  map:'<path d="m2.5 5 6.2-2.2 6.6 2.7 6.2-2.2v15l-6.2 2.4-6.6-2.6-6.2 2.2zM8.7 3v15M15.3 5.5v15"/>',
  trip:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M9 6h6a4 4 0 0 1 0 8H9a2 2 0 0 0 0 4h6"/>',
  list:'<path d="M8 5h13M8 12h13M8 19h13"/><path d="M3 5h.1M3 12h.1M3 19h.1" stroke-width="3"/>',
  star:'<path d="m12 2.5 2.8 6 6.6.9-4.8 4.7 1.1 6.6-5.7-3.1-5.7 3.1 1.1-6.6-4.8-4.7 6.6-.9z"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
  check:'<circle cx="12" cy="12" r="8.5"/><path d="m8.2 12 2.4 2.5 5.3-5.5"/>',
  pause:'<circle cx="12" cy="12" r="8.5"/><path d="M10 8v8M14 8v8"/>',
  off:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>',
  bolt:'<path d="M14 2 4 14h7l-1 8 10-13h-7z" fill="currentColor" stroke="none"/>',
  demo:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z" fill="currentColor" stroke="none"/>'
};
const ico=n=>'<svg aria-hidden="true" class="ico" viewBox="0 0 24 24">'+icons[n]+'</svg>';
const brand='<span class="brand"><svg aria-hidden="true" viewBox="0 0 32 28"><path fill="currentColor" d="M1 4h7l4 13 7-13h6L13 26H8zM26.5 4H32l-8.7 16.5H18z"/></svg>VoyBus</span>';
const demo='<span class="demo">'+ico('demo')+'Demo / posiciones simuladas</span>';
const status='<div class="status" aria-hidden="true">9:41<svg viewBox="0 0 60 14"><path d="M0 13V9h3v4zm5 0V7h3v6zm5 0V4h3v9zm5 0V1h3v12z"/><path d="M24 4q7-6 14 0l-1.8 2q-5.1-4.2-10.5 0zm3.5 4q3.5-3.4 7 0l-3.5 4z"/><rect x="42" y="2" width="15" height="10" rx="2" fill="none" stroke="currentColor"/><rect x="44" y="4" width="11" height="6" rx="1"/><path d="M58 5h2v4h-2z"/></svg></div>';
const favorites=new Set(['E01']);
const screens=[...document.querySelectorAll('.screen')];
const views=screens.map((_,i)=>({tab:i?'Líneas':'Mapa',filter:'Todas',query:'',line:'E01'}));
const stateIcon=line=>line.state==='Activa'?'check':line.state==='Inactiva'?'off':'pause';
const statusText=line=>'<span class="service '+stateIcon(line)+'">'+ico(stateIcon(line))+line.state+(line.electric?' · Eléctrica':'')+'</span>';
function star(line) {
  const active=favorites.has(line.id);
  return '<button class="star" data-star="'+line.id+'" aria-label="'+(active?'Quitar de':'Añadir a')+' favoritos, línea '+line.id+'" aria-pressed="'+active+'">'+ico('star')+'</button>';
}
function listHtml(v) {
  const fav=v.tab==='Favoritos';
  return '<div class="brandbar">'+brand+'<span class="place">'+ico('pin')+'Antofagasta</span></div><div class="catalog"><div class="catalog-title"><h2>'+v.tab+'</h2><span class="count" aria-live="polite"></span></div><label class="search">'+ico('search')+'<input type="search" placeholder="Buscar línea o destino" aria-label="Buscar línea o destino"></label><div class="filters" aria-label="Estado del servicio">'+['Todas','Activas','En pausa','Inactivas'].map(f=>'<button data-filter="'+f+'" aria-pressed="'+(v.filter===f)+'">'+f+'</button>').join('')+'</div><div class="rows" aria-label="'+(fav?'Líneas favoritas':'Catálogo de líneas')+'"></div>'+demo+'</div>';
}
const clean=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function repaintRows(screen,v) {
  const filtered=lines.filter(l=>(v.tab!=='Favoritos'||favorites.has(l.id))&&
    (v.filter==='Todas'||l.state===({'Activas':'Activa','En pausa':'Pausa temporal','Inactivas':'Inactiva'})[v.filter])&&
    clean([l.id,l.from,l.to].join(' ')).includes(clean(v.query.trim())));
  screen.querySelector('.count').textContent=filtered.length+' '+(filtered.length===1?'servicio':'servicios');
  screen.querySelector('.rows').innerHTML=filtered.map(l=>'<div class="row" style="--gtfs:'+l.color+'"><button class="row-main" data-route="'+l.id+'" aria-label="Ver línea '+l.id+' en el mapa"><span class="code">'+l.id+'</span><span><span class="dest">'+l.from+' → '+l.to+'</span>'+statusText(l)+'</span></button>'+star(l)+'</div>').join('') || '<p class="empty">'+(v.tab==='Favoritos'&&!favorites.size?'Marca una estrella para guardar tu primera línea.':'Ninguna línea coincide con tu búsqueda.')+'</p>';
}
const shore='M107 -12 113 17 123 33 128 58 137 71 135 88 146 108 150 137 149 152 140 166 141 188 137 199 143 211 142 224 154 242 151 256 158 269 156 278 166 296 174 305 178 327 172 341 181 356 186 378 197 387 206 409 199 423 191 432 184 451 181 473 169 488 171 502 162 522';
const coast=shore+' L390 522 390 -12Z';
const routes={
  E01:'M222 -4 231 30 223 40 238 76 228 85 249 125 222 143 230 160 188 185 200 208 188 215 211 261 209 276 231 314 222 328 246 375 236 385 250 417 237 429 227 466 214 486 209 523',
  '102':'M183 -4 201 39 193 45 217 96 209 106 218 129 177 157 185 176 166 189 187 232 183 243 205 283 201 291 217 324 211 337 230 376 223 386 233 410 215 431 205 467 189 488 184 523',
  '103':'M278 -4 290 26 270 45 294 90 283 103 303 139 273 162 282 178 254 196 289 255 273 269 303 321 281 338 311 392 290 413 301 443 278 466 262 521',
  '104':'M303 -4 314 29 296 45 320 89 307 104 337 155 300 183 312 202 287 218 316 272 306 284 333 333 316 353 339 394 319 413 336 448 303 477 286 523',
  '107':'M333 -4 344 29 327 48 351 95 339 108 367 157 334 184 349 212 323 230 351 281 333 294 360 341 347 358 375 403 354 427 363 450 333 478 318 523'
};
const busPositions=[['102',187,232],['103',294,90],['E01',231,314],['102',205,467],['E01',228,85],['103',290,413]];
function atlas(selected) {
  let blocks='',parks='',shelves='',hills='';
  // Offset each district's street grid as the coast changes direction.
  const districts=[
    [-35,24,21,-24,1],[78,122,16,-26,2],[178,112,22,-27,3],[292,157,21,-25,4],[396,145,19,23,5]
  ];
  for(const [y,x,w,tilt,seed] of districts){
    const clip='urban-'+seed;
    blocks+='<clipPath id="'+clip+'-'+selected+'"><rect x="0" y="'+y+'" width="360" height="'+(seed===1?113:seed===2?100:seed===3?114:seed===4?104:136)+'"/></clipPath><g clip-path="url(#'+clip+'-'+selected+')"><g transform="translate('+x+' '+y+') rotate('+tilt+')">';
    for(let row=-9;row<15;row++){
      for(let col=-6;col<18;col++){
        const offset=(row%5===0?1.5:0);
        const rx=col*(w+2.5), ry=row*13.8;
        const variation=Math.abs(row*19+col*13+seed)%11;
        const fill=variation===0?'#263b39':variation<4?'#303d47':'#2d3943';
        blocks+='<rect x="'+rx+'" y="'+(ry+offset)+'" width="'+w+'" height="'+(11.45-offset)+'" rx="1.3" fill="'+fill+'" />';
        if(variation<6)blocks+='<path d="M'+(rx+2)+' '+(ry+8)+'h'+(w/2)+'v-4h'+(w/3)+'" fill="none" stroke="#3a4750" stroke-width=".7"/>';
      }
    }
    blocks+='</g></g>';
  }
  for(let i=1;i<=7;i++){let d='';for(let y=-10;y<540;y+=7){const x=111+y*.15-i*14+Math.sin(y/32+i*.43)*(4+i)+Math.sin(y/14+i*.8)*(3+i*.32);d+=(d?'L':'M')+x.toFixed(1)+' '+y} shelves+='<path d="'+d+'" fill="none" stroke="#26414d" opacity=".72" stroke-width=".65"/>'}
  for(let i=0;i<7;i++){ hills+='<path d="M'+(324+i*6)+' -5q-21 42 5 69t14 73q-7 34 34 61" fill="none" stroke="#47504f" stroke-width=".9"/>' }
  parks='<path fill="#344c42" stroke="#536451" stroke-width="1" d="m246 239 26-15 12 23-26 15zM158 98l14-8 12 24-14 8zM277 366l17-11 10 17-18 12z"/>';
  const routeInk=Object.entries(routes).filter(([id])=>id===selected||['102','103'].includes(id)).sort(([a],[b])=>(a===selected)-(b===selected)).map(([id,d])=>'<path d="'+d+'" stroke="'+(id===selected?'#c8f477':'#5792b0')+'" stroke-width="'+(id===selected?'2.9':'1.65')+'" fill="none" stroke-linejoin="round" stroke-linecap="round"/>').join('');
  const text=(x,y,s,opts='')=>'<text x="'+x+'" y="'+y+'" '+opts+'>'+s+'</text>';
  return '<svg class="map-art" aria-label="Mapa ilustrado de Antofagasta" role="img" viewBox="0 0 360 510" preserveAspectRatio="none"><defs><clipPath id="land-'+selected+'"><path d="'+coast+'"/></clipPath></defs><rect width="360" height="510" fill="#162d39"/>'+shelves+
    '<path d="'+coast+'" fill="#47525a"/><g clip-path="url(#land-'+selected+')">'+blocks+parks+
    '<path d="M312 -5q-10 37 8 68t18 58q0 33 33 79V-5z" fill="#303b3b"/>'+hills+'</g>'+
    '<path d="'+shore+'" fill="none" stroke="#829298" stroke-width="1.1"/><path d="m145 183-22 9-6-11-25 10 3 7 22-8 5 11 21-9m4 50-21 11-4-6 20-12" fill="#40515b" stroke="#667780" stroke-width="1"/>'+
    '<g fill="none" stroke="#748086" stroke-width="2.4" opacity=".7"><path d="'+routes.E01+'"/><path d="'+routes['103']+'"/><path d="'+routes['102']+'"/><path d="m137 188 67-37 37-29 113-68M164 291l64-37 50-36 89-49m-182 220 66-36 78-57 41-24"/></g>'+routeInk+
    '<g fill="#1c2931" stroke="#d3e5ba" stroke-width="1.4">'+[[238,76],[222,143],[188,185],[211,261],[222,328],[250,417],[214,486]].map(([x,y])=>'<rect x="'+(x-2.3)+'" y="'+(y-2.3)+'" width="4.6" height="4.6" rx="1"/>').join('')+'</g>'+
    '<g font-family="Barlow,Arial,sans-serif" font-size="12" fill="#c8d2d4" paint-order="stroke" stroke="#26343e" stroke-width="3" stroke-linejoin="round">'+
    text(151,139,'Costanera','transform="rotate(65 151 139)"')+text(296,225,'Av. Argentina','transform="rotate(60 296 225)"')+
    text(186,220,'Antofagasta','font-size="21" font-weight="600" letter-spacing="-.6" fill="#e4e9e5"')+
    text(246,294,'Centro','font-weight="600"')+text(247,464,'Av. Brasil','transform="rotate(-24 247 464)"')+
    text(24,264,'Océano','stroke="#162d39" fill="#99b5c0" font-size="16" font-style="italic"')+text(24,283,'Pacífico','stroke="#162d39" fill="#99b5c0" font-size="16" font-style="italic"')+
    text(77,217,'Puerto','stroke="#162d39" fill="#a1b5bf"')+'</g></svg>';
}
function mapHtml(v,instance) {
  const l=lines.find(l=>l.id===v.line);
  const markers=busPositions.map(([id,x,y],i)=>{
    const bus=lines.find(l=>l.id===id);
    return '<button class="marker" style="left:'+x/360*100+'%;top:'+y/510*100+'%" data-bus="'+id+'" data-index="'+i+'" aria-label="Bus simulado, línea '+id+'" aria-pressed="'+(id===v.line && i===(v.marker??2))+'"><span class="marker-label">'+id+'</span><svg class="vehicle" aria-hidden="true" viewBox="0 0 20 24"><rect x="1.5" y="1.5" width="17" height="20" rx="4.5" fill="'+bus.color+'" stroke="#e5ebe4" stroke-width="1.3"/><rect x="4.5" y="5" width="11" height="6" rx="1.3" fill="#eef5ed"/><path d="M5 22v1m10-1v1" stroke="#e5ebe4" stroke-width="2"/><circle cx="5.8" cy="17.2" r="1.3" fill="#fff"/><circle cx="14.2" cy="17.2" r="1.3" fill="#fff"/>'+(bus.electric?'<path d="m11.5 10-4 5h2.4l-.6 4 4-5h-2.4z" fill="#f8ffbb"/>':'')+'</svg></button>';
  }).join('');
  return '<div class="map-wrap">'+atlas(l.id).replaceAll(l.id+'"',l.id+'-'+instance+'"').replaceAll(l.id+')',l.id+'-'+instance+')')+markers+'</div><div class="map-header">'+brand+'<span class="compass"><svg aria-hidden="true" viewBox="0 0 12 20"><path d="m6 1 5 15-5-4z" fill="#d1fa75"/><path d="M6 1 1 16l5-4z" fill="#dde6dd"/></svg>N</span></div><div class="map-spacer"></div><section class="sheet" aria-label="Detalle de línea"><div class="sheet-meta"><span>Recorrido seleccionado</span>'+statusText(l)+'</div><div class="sheet-line"><h2 class="sheet-code">'+l.id+(l.electric?'<span class="electric">'+ico('bolt')+'</span>':'')+'</h2>'+star(l)+'</div><div class="sheet-rule"><svg aria-hidden="true" viewBox="0 0 14 47" class="line-track"><path d="M7 7v33" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="6" r="4" fill="#19232c" stroke="currentColor" stroke-width="2"/><rect x="3" y="36" width="8" height="8" fill="currentColor"/></svg><div class="stops"><div class="stop">'+l.from+'<small>Origen</small></div><div class="stop">'+l.to+'<small>Destino</small></div></div></div>'+demo+'</section>';
}
function render(i) {
  const s=screens[i],v=views[i];
  const journey='<div class="brandbar">'+brand+'<span class="place">'+ico('pin')+'Antofagasta</span></div><div class="journey"><h2>Mi viaje</h2><p>Elige una línea para consultar su recorrido.</p><button data-tab="Líneas">Elegir línea</button>'+demo+'</div>';
  s.innerHTML=status+'<div class="content">'+(v.tab==='Mapa'?mapHtml(v,i):v.tab==='Mi viaje'?journey:listHtml(v))+'</div><nav class="nav" aria-label="Navegación de la pantalla '+(i+1)+'">'+[['Mapa','map'],['Líneas','list'],['Favoritos','star'],['Mi viaje','trip']].map(([name,symbol])=>'<button data-tab="'+name+'" '+(v.tab===name?'aria-current="page"':'')+'>'+ico(symbol)+name+'</button>').join('')+'</nav>';
  if(s.querySelector('input')){s.querySelector('input').value=v.query;repaintRows(s,v)}
}
screens.forEach((s,i)=>{
  const v=views[i];
  s.addEventListener('input',e=>{if(e.target.matches('input')){v.query=e.target.value;repaintRows(s,v)}});
  s.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    let focus;
    if(b.dataset.tab){v.tab=b.dataset.tab; v.filter='Todas'; v.query=''; focus='[data-tab="'+v.tab+'"]'}
    else if(b.dataset.filter){v.filter=b.dataset.filter; focus='[data-filter="'+v.filter+'"]'}
    else if(b.dataset.route||b.dataset.bus){
      v.line=b.dataset.route||b.dataset.bus;v.tab='Mapa';
      v.marker=b.dataset.index!=null?Number(b.dataset.index):busPositions.findIndex(([id])=>id===v.line);
      focus=b.dataset.bus?'[data-index="'+v.marker+'"]':'.sheet .star';
    }else if(b.dataset.star){
      const id=b.dataset.star;
      if(favorites.has(id)) favorites.delete(id);else favorites.add(id);
      screens.forEach((_,j)=>render(j)); focus='[data-star="'+id+'"]';
    }
    render(i);
    if(e.detail===0)(s.querySelector(focus)||s.querySelector('[aria-current=page]'))?.focus();
  });render(i);
});
</script>
